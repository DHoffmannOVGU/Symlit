# Symlit with a dedicated PostgreSQL server.
#   docker compose up --build      -> http://localhost:5000
# Data lives in the named volume "symlit-db".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: symlit
      POSTGRES_PASSWORD: symlit
      POSTGRES_DB: symlit
    volumes:
      - symlit-db:/var/lib/postgresql/data
    ports:
      # Exposed on loopback so `npm run dev` / `npm run test:postgres` can use it too.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symlit -d symlit"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://symlit:symlit@db:5432/symlit
      # Optional: enable the AI metamodel assistant.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  symlit-db:
